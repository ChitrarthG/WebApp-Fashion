services:
  - type: web
    name: webapp-fashion-app
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix backend --no-audit --no-fund && npm ci --prefix frontend --no-audit --no-fund && CI=false npm run build --prefix frontend
    startCommand: npm --prefix backend run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webapp-fashion-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_RATE_LIMIT_MAX
        value: "300"
      - key: REACT_APP_API_URL
        value: /api
      - key: REACT_APP_MAPS_ENABLED
        value: "false"

databases:
  - name: webapp-fashion-db
    plan: free
    region: oregon
    databaseName: webapp_fashion
    user: webapp_fashion_user